services:
  dashboard:
    build: .
    image: customer360-dashboard:local
    ports:
      - "5000:5000"
    environment:
      EXECUTION_MODE: local
      LOCAL_BACKEND: sqlite
      AWS_ENABLED: "false"
      USE_GCP: "false"
      FLASK_DEBUG: "false"
      PORT: "5000"
      LOG_FORMAT: json
      STORAGE_DIR: /app/storage
      SQLITE_DB_PATH: /app/storage/customer_360.db
    volumes:
      - C:/Customer360/storage:/app/storage
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  analytics:
    profiles: ["analytics"]
    build: .
    image: customer360-dashboard:local
    depends_on:
      dashboard:
        condition: service_healthy
    environment:
      EXECUTION_MODE: local
      LOCAL_BACKEND: sqlite
      AWS_ENABLED: "false"
      USE_GCP: "false"
      FLASK_DEBUG: "false"
      STORAGE_DIR: /app/storage
      SQLITE_DB_PATH: /app/storage/customer_360.db
    volumes:
      - C:/Customer360/storage:/app/storage
    command:
      - python
      - transformations/ltv_analysis.py
    restart: "no"
